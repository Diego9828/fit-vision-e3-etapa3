stages:
  seleccionar:
    desc: "3.1 seleccionar · docs/decisiones/0002-alcance-filas.md, docs/decisiones/0003-fuentes-excluidas.md"
    cmd: python src/seleccionar.py datos/crudo datos/intermedio reportes/seleccion.json
    deps:
      - src/seleccionar.py
      - src/comun.py
      - datos/crudo
    params:
      - columnas
      - seleccion
    outs:
      - datos/intermedio/clips_seleccionados.parquet
      - datos/intermedio/frames_seleccionados.parquet
    metrics:
      - reportes/seleccion.json:
          cache: false

  limpiar:
    desc: "3.2 limpiar · docs/decisiones/0004-limpieza-senales.md"
    cmd: python src/limpiar.py datos/intermedio reportes/limpieza.json reportes/informe_limpieza.md
    deps:
      - src/limpiar.py
      - src/comun.py
      - datos/intermedio/frames_seleccionados.parquet
    params:
      - columnas
      - limpieza
    outs:
      - datos/intermedio/limpio.parquet
      - reportes/informe_limpieza.md:
          cache: false
    metrics:
      - reportes/limpieza.json:
          cache: false

  construir:
    desc: "3.3 construir · docs/decisiones/0005-construccion-features.md"
    cmd: python src/construir.py datos/intermedio
    deps:
      - src/construir.py
      - src/comun.py
      - datos/intermedio/limpio.parquet
    params:
      - columnas
      - construccion
    outs:
      - datos/intermedio/construido.parquet

  integrar:
    desc: "3.4 integrar · docs/decisiones/0006-integracion-y-particion.md"
    cmd: python src/integrar.py datos/intermedio
    deps:
      - src/integrar.py
      - src/comun.py
      - datos/intermedio/construido.parquet
      - datos/intermedio/clips_seleccionados.parquet
    params:
      - columnas
    outs:
      - datos/intermedio/integrado.parquet

  formatear:
    desc: "3.5 formatear · docs/decisiones/0007-formato-y-diccionario.md, docs/decisiones/0006-integracion-y-particion.md"
    cmd: python src/formatear.py datos/intermedio datos/final reportes/tabla_final.json
    deps:
      - src/formatear.py
      - src/comun.py
      - datos/intermedio/integrado.parquet
    params:
      - columnas
      - construccion.estadisticos
      - particion
      - formato
    outs:
      - datos/final/tabla_modelado.parquet
      - datos/final/tabla_modelado.csv
    metrics:
      - reportes/tabla_final.json:
          cache: false

  diccionario:
    desc: "3.5 formatear (descripción del conjunto) · docs/decisiones/0007-formato-y-diccionario.md"
    cmd: python src/diccionario.py datos/final/tabla_modelado.parquet docs/diccionario/descripciones.yaml docs/diccionario/diccionario.csv
    deps:
      - src/diccionario.py
      - datos/final/tabla_modelado.parquet
      - docs/diccionario/descripciones.yaml
    outs:
      - docs/diccionario/diccionario.csv:
          cache: false
