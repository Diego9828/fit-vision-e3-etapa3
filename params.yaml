columnas:
  id_clip: clip_id
  frame: frame
  video: video
  etiqueta: etiqueta
  n_frames: n_frames
  senales: [postura_torso, nivel_cabeza, apertura_mano_izq, angulo_pie_izq]

seleccion:
  etiquetas_candidatas: [bien, mal, base]
  min_clips_por_clase: 2

limpieza:
  eliminar_frames_congelados: true
  estrategia_faltantes: interpolacion_lineal   # alternativa: mediana_clip
  min_frames_por_clip: 3
  limites:                                      # rango físico plausible por señal
    postura_torso: [0, 180]
    nivel_cabeza: [0, 90]
    apertura_mano_izq: [0, 1]
    angulo_pie_izq: [0, 180]

construccion:
  estadisticos: {media: mean, desv: std}   # sufijo de columna: función de pandas
  ddof: 0
